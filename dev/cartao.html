</div>

<script>
var TIPO='DV', DIRECAO='Saida', CHAVE='<?= chave ?>';
var PAGAMENTO = 'avista';

function selPagamento(tipo) {
  PAGAMENTO = tipo;
  document.getElementById('pag-avista').className    = 'btn btn-outline-primary' + (tipo==='avista'?' active':'');
  document.getElementById('pag-parcelado').className = 'btn btn-outline-primary' + (tipo==='parcelado'?' active':'');
  document.getElementById('bloco-parcelas').classList.toggle('d-none', tipo!=='parcelado');
  if (tipo==='parcelado') calcularParcelas();
}

function calcularParcelas() {
  var total     = parseFloat(document.getElementById('valor').value) || 0;
  var nparcelas = parseInt(document.getElementById('num-parcelas').value) || 0;
  var preview   = document.getElementById('preview-parcelas');
  if (!total || !nparcelas) { preview.textContent=''; return; }
  var parcela = (total / nparcelas).toFixed(2).replace('.',',');
  preview.textContent = nparcelas + 'x de R$ ' + parcela + ' = R$ ' + total.toFixed(2).replace('.',',');
}
<?if (acesso && cartoes.length === 1) {?>
var CARTAO={codigo:'<?= cartoes[0].codigo ?>',nome:'<?= cartoes[0].nome ?>'};
<?} else {?>
var CARTAO=null;
<?}?>

function selCartao(idx, codigo, nome){
  CARTAO={codigo:codigo, nome:nome};
  var btns=document.querySelectorAll('[id^="btn-cartao-"]');
  btns.forEach(function(b,i){
    b.className='btn btn-sm w-100 text-start py-2 '+(i===idx?'btn-primary':'btn-outline-secondary');
  });
}

function selDir(dir){
  DIRECAO=dir;
  document.getElementById('dir-saida').className='btn btn-lg '+(dir==='Saida'?'btn-danger active':'btn-outline-danger');
  document.getElementById('dir-entrada').className='btn btn-lg '+(dir==='Entrada'?'btn-success active':'btn-outline-success');
}

function selTipo(t){
  TIPO=t;
  ['DV','DF','NA'].forEach(function(x){
    document.getElementById('tipo-'+x).className='btn '+(x===t?'btn-primary':'btn-outline-primary');
  });
}

var STORAGE_KEY = "historico_cartao";
// Usar apenas memória de sessão (não persiste entre aberturas — evita confusão)
var HISTORICO = [];

function fb(msg,tipo){
  var el=document.getElementById('feedback');
  el.innerHTML=msg;
  el.className='alert alert-'+(tipo==='ok'?'success':'danger');
  if(tipo==='ok') setTimeout(function(){el.className='alert d-none';limpar();},2000);
}

function adicionarHistorico(desc, valor, direcao, tipo, nparcelas) {
  var agora = new Date();
  var hora = agora.getHours().toString().padStart(2,'0') + ':' + agora.getMinutes().toString().padStart(2,'0');
  var entrada = direcao==='Entrada';
  HISTORICO.unshift({ desc:desc, valor:valor, entrada:entrada, tipo:tipo, hora:hora, nparcelas:nparcelas||1 });
  if(HISTORICO.length > 8) HISTORICO.pop();
  renderHistorico();
}

function renderHistorico() {
  var wrap = document.getElementById('historico-wrap');
  var lista = document.getElementById('historico-lista');
  if(!HISTORICO.length) { wrap.style.display='none'; return; }
  wrap.style.display='block';
  lista.innerHTML = HISTORICO.map(function(r) {
    var cor = r.entrada ? 'success' : 'danger';
    var sinal = r.entrada ? '+' : '-';
    var parcelInfo = r.nparcelas > 1 ? ' · ' + r.nparcelas + 'x' : '';
    return '<div class="d-flex align-items-center gap-2 p-2 mb-1 bg-white rounded border">' +
      '<span class="badge bg-'+cor+' fs-6">'+(r.entrada?'⬆':'⬇')+'</span>' +
      '<div class="flex-grow-1"><div class="fw-semibold" style="font-size:0.9rem;">'+r.desc+'</div>' +
      '<div class="text-muted" style="font-size:0.78rem;">'+r.tipo+parcelInfo+' · '+r.hora+'</div></div>' +
      '<span class="fw-bold text-'+cor+'" style="font-size:0.9rem;white-space:nowrap;">'+sinal+'R$ '+r.valor.toFixed(2).replace('.',',')+'</span>' +
      '</div>';
  }).join('');
}

function limparHistorico() {
  HISTORICO=[];
  document.getElementById('historico-wrap').style.display='none';
}

function limpar(){
  document.getElementById('valor').value='';
  document.getElementById('desc').value='';
  TIPO='DV'; DIRECAO='Saida';
  selDir('Saida'); selTipo('DV');
  <?if (acesso && cartoes.length === 1) {?>
  CARTAO={codigo:'<?= cartoes[0].codigo ?>',nome:'<?= cartoes[0].nome ?>'};
  <?} else if (acesso && cartoes.length > 1) {?>
  CARTAO=null;
  document.querySelectorAll('[id^="btn-cartao-"]').forEach(function(b){
    b.className=b.className.replace('btn-primary','btn-outline-secondary');
  });
  <?}?>
}

function enviar(){
  var valor=parseFloat(document.getElementById('valor').value);
  var desc=document.getElementById('desc').value.trim();
  if(!CARTAO){fb('Selecione o cartao.','erro');return;}
  if(!valor||valor<=0){fb('Informe um valor valido.','erro');return;}
  if(PAGAMENTO==='parcelado') {
    var nparcelas = parseInt(document.getElementById('num-parcelas').value)||0;
    if(!nparcelas||nparcelas<2){fb('Informe o numero de parcelas (minimo 2).','erro');return;}
  }
  if(!desc){fb('Informe a descricao.','erro');return;}

  var parcelado   = PAGAMENTO === 'parcelado';
  var numParcelas = parcelado ? (parseInt(document.getElementById('num-parcelas').value) || 1) : 1;

  var btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.textContent='⏳ Registrando...';

  var dados = {
    valor:       valor,
    descricao:   desc,
    cartao:      CARTAO.codigo,
    nomeCartao:  CARTAO.nome,
    tipo:        TIPO,
    direcao:     DIRECAO,
    chave:       CHAVE,
    parcelado:   parcelado,
    numParcelas: numParcelas
  };

  google.script.run
    .withSuccessHandler(function(res){
      if(res&&res.ok){
        var nRec = res.registros || 1;
        var s = DIRECAO==='Entrada'?'+':'-';
        var msg = nRec > 1
          ? '✅ <strong>'+CARTAO.nome+'</strong><br>'+desc+'<br>'+nRec+'x de '+s+'R$ '+(valor/nRec).toFixed(2).replace('.',',')
          : '✅ <strong>'+CARTAO.nome+'</strong><br>'+desc+'<br>'+s+'R$ '+valor.toFixed(2).replace('.',',');
        adicionarHistorico(desc, parcelado ? valor/numParcelas : valor, DIRECAO, TIPO, parcelado ? numParcelas : 1);
        fb(msg,'ok');
        if(parcelado) { selPagamento('avista'); document.getElementById('num-parcelas').value='12'; }
        // Bloquear botão 3s para evitar duplo registro
        btn.textContent='✅ Registrado!';
        btn.style.background='#15803d';
        setTimeout(function(){
          btn.disabled=false;
          btn.textContent='💳 Registrar Despesa';
          btn.style.background='';
        }, 3000);
      } else {
        btn.disabled=false; btn.textContent='💳 Registrar Despesa';
        fb('❌ '+(res?res.erro:'Erro'),'erro');
      }
    })
    .withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='💳 Registrar Despesa';
      fb('❌ '+err.message,'erro');
    })
    .registrarCartao(dados);
}
// Exibir histórico salvo ao carregar
window.addEventListener('DOMContentLoaded', function() { renderHistorico(); });
</script>
</body>
