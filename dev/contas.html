<body class="bg-light p-3">
  <div class="bc">
    <span>🏦 Painel Financeiro</span>
    <span class="bc-sep">›</span>
    <span class="bc-atual">Contas</span>
  </div>

<div class="d-flex align-items-center gap-2 mb-1">
  <span style="font-size:1.6rem;">🏦</span>
  <h5 class="fw-bold mb-0">Contas</h5>
  <span class="badge rounded-pill text-bg-success ms-1">Gerenciar</span>
</div>
<p class="text-muted small mb-3">Cadastre e gerencie as contas bancárias e carteiras</p>

<div id="tela-loading" class="text-center py-4 text-muted">
  <div class="spinner-border spinner-border-sm me-2"></div> Carregando...
</div>

<div id="tela-conteudo" class="d-none">
  <div class="card mb-3">
    <div class="card-header fw-bold">Contas cadastradas</div>
    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>Nome</th>
            <th class="text-center">Código</th>
            <th class="text-center">Tipo</th>
            <th class="text-center">Ativo</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody-contas"></tbody>
      </table>
    </div>
  </div>

  <div class="card mb-3" id="card-form" style="display:none;">
    <div class="card-header fw-bold" id="form-titulo">Nova conta</div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label fw-semibold">Nome *</label>
        <input type="text" class="form-control" id="f-nome" placeholder="Ex: Itau, Nubank...">
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Código *</label>
        <input type="text" class="form-control" id="f-codigo" placeholder="Ex: BK4, CX2"
               oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')">
        <div class="form-text">Identificador único sem espaços — não pode ser alterado depois</div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Tipo *</label>
        <select class="form-select" id="f-tipo">
          <option value="banco">🏦 Banco</option>
          <option value="carteira">💵 Carteira / Dinheiro</option>
          <option value="investimento">📈 Investimento</option>
          <option value="outro">📋 Outro</option>
        </select>
      </div>
      <div class="mb-3 p-3 bg-white rounded border">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="f-ativo" checked style="width:2em;height:1.2em;">
          <label class="form-check-label fw-semibold ms-2" for="f-ativo">Conta ativa</label>
          <div class="text-muted small">Contas inativas não aparecem nos formulários de lançamento</div>
        </div>
      </div>
      <input type="hidden" id="f-linha">
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary flex-shrink-0" onclick="fecharForm()">Cancelar</button>
        <button class="btn btn-primary w-100 fw-bold" id="btn-salvar" onclick="salvar()">💾 Salvar</button>
      </div>
      <div id="feedback-form" class="alert d-none mt-2"></div>
    </div>
  </div>

  <div class="d-grid">
    <button class="btn btn-outline-primary btn-lg" onclick="novaConta()">➕ Adicionar conta</button>
  </div>
</div>

<script>
var DADOS = [];
var ICONES = { banco:'🏦', carteira:'💵', investimento:'📈', outro:'📋' };

window.addEventListener('DOMContentLoaded', function() {
  google.script.run
    .withSuccessHandler(function(res) {
      document.getElementById('tela-loading').style.display = 'none';
      document.getElementById('tela-conteudo').classList.remove('d-none');
      DADOS = res || [];
      renderTabela();
    })
    .withFailureHandler(function(err) {
      document.getElementById('tela-loading').innerHTML =
        '<div class="alert alert-danger">Erro: ' + err.message + '</div>';
    })
    .getContas();
});

function renderTabela() {
  var tbody = document.getElementById('tbody-contas');
  if (!DADOS.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhuma conta cadastrada</td></tr>';
    return;
  }
  tbody.innerHTML = DADOS.map(function(r, i) {
    var icone = ICONES[r.tipo] || '📋';
    var ativo = r.ativo !== false;
    return '<tr class="' + (ativo ? '' : 'opacity-50') + '">' +
      '<td class="fw-semibold">' + icone + ' ' + r.nome + '</td>' +
      '<td class="text-center"><code>' + r.codigo + '</code></td>' +
      '<td class="text-center text-muted small">' + (r.tipo||'banco') + '</td>' +
      '<td class="text-center">' + (ativo
        ? '<span class="badge bg-success">Sim</span>'
        : '<span class="badge bg-secondary">Não</span>') + '</td>' +
      '<td class="text-end">' +
        '<button class="btn btn-sm btn-outline-secondary" onclick="editar(' + i + ')">✏️</button>' +
      '</td>' +
    '</tr>';
  }).join('');
}

function editar(idx) {
  var r = DADOS[idx];
  document.getElementById('f-nome').value    = r.nome   || '';
  document.getElementById('f-codigo').value  = r.codigo || '';
  document.getElementById('f-tipo').value    = r.tipo   || 'banco';
  document.getElementById('f-ativo').checked = r.ativo !== false;
  document.getElementById('f-linha').value   = r.linha  || '';
  document.getElementById('f-codigo').disabled = true;
  document.getElementById('form-titulo').textContent = '✏️ Editar: ' + r.nome;
  mostrarForm();
}

function novaConta() {
  document.getElementById('f-nome').value    = '';
  document.getElementById('f-codigo').value  = '';
  document.getElementById('f-tipo').value    = 'banco';
  document.getElementById('f-ativo').checked = true;
  document.getElementById('f-linha').value   = '';
  document.getElementById('f-codigo').disabled = false;
  document.getElementById('form-titulo').textContent = '➕ Nova conta';
  document.getElementById('feedback-form').className = 'alert d-none';
  mostrarForm();
}

function mostrarForm() {
  document.getElementById('feedback-form').className = 'alert d-none';
  document.getElementById('card-form').style.display = 'block';
  document.getElementById('card-form').scrollIntoView({ behavior: 'smooth' });
}

function fecharForm() {
  document.getElementById('card-form').style.display = 'none';
  document.getElementById('f-codigo').disabled = false;
}

function salvar() {
  var nome   = document.getElementById('f-nome').value.trim();
  var codigo = document.getElementById('f-codigo').value.trim().toUpperCase();
  var tipo   = document.getElementById('f-tipo').value;
  var ativo  = document.getElementById('f-ativo').checked;
  var linha  = document.getElementById('f-linha').value;

  if (!nome)   { fbForm('Informe o nome.', 'danger'); return; }
  if (!codigo) { fbForm('Informe o código.', 'danger'); return; }

  var btn = document.getElementById('btn-salvar');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '⏳ Salvando...';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = '💾 Salvar';
      if (res && res.ok) {
        DADOS = res.dados || DADOS;
        renderTabela();
        fbForm('✅ Salvo com sucesso!', 'success');
        setTimeout(fecharForm, 1200);
      } else {
        fbForm('❌ ' + (res ? res.erro : 'Erro desconhecido'), 'danger');
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false; btn.textContent = '💾 Salvar';
      fbForm('❌ ' + err.message, 'danger');
    })
    .salvarConta({ nome:nome, codigo:codigo, tipo:tipo, ativo:ativo, linha:linha });
}

function fbForm(msg, tipo) {
  var el = document.getElementById('feedback-form');
  el.textContent = msg;
  el.className = 'alert alert-' + tipo + ' mt-2';
}
</script>
</body>
</html>
