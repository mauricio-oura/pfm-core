<script>
var CONTAS = <?!= JSON.stringify(contasLista) ?>;
var OP='', TIPO='DV';

// Preencher email
<?!= emailUsuario ? 'document.getElementById("usr-email").textContent = "👤 ' + emailUsuario + '";' : '' ?>

// Preencher selects com contas do template (sem chamada GAS)
['conta-saida','conta-entrada','transf-origem','transf-destino'].forEach(function(id){
  var sel = document.getElementById(id);
  while (sel.options.length > 1) sel.remove(1);
  CONTAS.forEach(function(c){
    var o = document.createElement('option');
    o.value = c.nome;
    o.textContent = c.nome + ' (' + c.codigo + ')';
    sel.appendChild(o);
  });
});

function selOp(op){
  OP=op;
  ['saida','entrada','transf'].forEach(function(o){
    var btn=document.getElementById('op-'+o);
    btn.className='btn text-start '+(o===op?
      (o==='saida'?'btn-danger':o==='entrada'?'btn-success':'btn-primary'):
      'btn-outline-secondary');
    btn.style.fontSize = '0.78rem';
  });
  ['bloco-saida','bloco-entrada','bloco-transf','bloco-tipo'].forEach(function(id){
    document.getElementById(id).classList.remove('bloco-ativo');
  });
  document.getElementById('bloco-saida').classList.toggle('d-none', op!=='saida');
  document.getElementById('bloco-entrada').classList.toggle('d-none', op!=='entrada');
  document.getElementById('bloco-transf').classList.toggle('d-none', op!=='transf');
  document.getElementById('bloco-tipo').classList.toggle('d-none', op==='transf');
  // Highlight amarelo nos blocos que aparecem
  if(op==='saida')   { document.getElementById('bloco-saida').classList.add('bloco-ativo'); }
  if(op==='entrada') { document.getElementById('bloco-entrada').classList.add('bloco-ativo'); }
  if(op==='transf')  { document.getElementById('bloco-transf').classList.add('bloco-ativo'); }
  if(op!=='transf')  { document.getElementById('bloco-tipo').classList.add('bloco-ativo'); }
  if(op==='transf') selTipo('NA'); else selTipo('DV');
}

function selTipo(t){
  TIPO=t;
  ['DV','DF','NA'].forEach(function(x){
    var btn=document.getElementById('tipo-'+x);
    btn.className='btn '+(x===t?'btn-primary':'btn-outline-primary');
  });
}

var STORAGE_KEY = "historico_lancar";
var HISTORICO = (function() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch(e) { return []; }
})();

function fb(msg,tipo){
  var el=document.getElementById('feedback');
  el.textContent=msg;
  el.className='alert alert-'+(tipo==='ok'?'success':tipo==='erro'?'danger':'info');
  if(tipo==='ok') setTimeout(function(){el.className='alert d-none';limpar();},1500);
}

function adicionarHistorico(op, desc, valor, conta, tipo) {
  var agora = new Date();
  var hora = agora.getHours().toString().padStart(2,'0') + ':' + agora.getMinutes().toString().padStart(2,'0');
  var sinal = op==='entrada' ? '+' : op==='transf' ? '↔' : '-';
  var cor = op==='entrada' ? 'success' : op==='transf' ? 'primary' : 'danger';
  HISTORICO.unshift({ sinal:sinal, cor:cor, desc:desc, valor:valor, conta:conta, tipo:tipo, hora:hora });
  if(HISTORICO.length > 5) HISTORICO.pop();
  renderHistorico();
}

function renderHistorico() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(HISTORICO)); } catch(e) {}
  var wrap = document.getElementById('historico-wrap');
  var lista = document.getElementById('historico-lista');
  if(!HISTORICO.length) { wrap.style.display='none'; return; }
  wrap.style.display='block';
  lista.innerHTML = HISTORICO.map(function(r) {
    return '<div class="d-flex align-items-center gap-2 p-2 mb-1 bg-white rounded border">' +
      '<span class="badge bg-'+r.cor+' fs-6">'+r.sinal+'</span>' +
      '<div class="flex-grow-1"><div class="fw-semibold" style="font-size:0.9rem;">'+r.desc+'</div>' +
      '<div class="text-muted" style="font-size:0.78rem;">'+r.conta+' · '+r.tipo+' · '+r.hora+'</div></div>' +
      '<span class="fw-bold text-'+r.cor+'" style="font-size:0.9rem;white-space:nowrap;">R$ '+r.valor.toFixed(2).replace('.',',')+'</span>' +
      '</div>';
  }).join('');
}

function limparHistorico() {
  HISTORICO=[];
  document.getElementById('historico-wrap').style.display='none';
}

function limpar(){
  document.getElementById('valor').value='';
  document.getElementById('desc').value='';
  ['conta-saida','conta-entrada','transf-origem','transf-destino'].forEach(function(id){document.getElementById(id).value='';});
  var _hoje = new Date();
  document.getElementById('data-lanc').value =
    _hoje.getFullYear() + '-' +
    String(_hoje.getMonth()+1).padStart(2,'0') + '-' +
    String(_hoje.getDate()).padStart(2,'0');
  OP=''; TIPO='DV';
  ['saida','entrada','transf'].forEach(function(o){var b=document.getElementById('op-'+o);b.className='btn btn-outline-secondary text-start';b.style.fontSize='0.78rem';});
  ['bloco-saida','bloco-entrada','bloco-transf','bloco-tipo'].forEach(function(id){document.getElementById(id).classList.add('d-none');});
}

function toggleRecorrente() {
  var checked = document.getElementById('recorrente').checked;
  document.getElementById('bloco-recorrente').classList.toggle('d-none', !checked);
  if (checked) {
    // Sugerir data inicial como amanhã
    var d = new Date();
    d.setDate(d.getDate() + 1);
    document.getElementById('data-inicial').value = d.toISOString().split('T')[0];
    atualizarPreviewRecorrente();
  }
}

function atualizarPreviewRecorrente() {
  var dataStr = document.getElementById('data-inicial').value;
  var meses = parseInt(document.getElementById('num-meses').value) || 0;
  var preview = document.getElementById('preview-recorrente');
  if (!dataStr || !meses) { preview.textContent = ''; return; }
  var d = new Date(dataStr + 'T12:00:00');
  var datas = [];
  for (var i = 0; i < meses; i++) {
    var data = new Date(d.getFullYear(), d.getMonth() + i, d.getDate());
    // Verificar se é último dia do mês de referência
    var ultimoDiaMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    if (d.getDate() === ultimoDiaMes) {
      data = new Date(data.getFullYear(), data.getMonth() + 1, 0);
    }
    datas.push(data.toLocaleDateString('pt-BR'));
  }
  preview.textContent = meses + ' lançamentos: ' + datas[0] + ' ... ' + datas[datas.length-1];
}

document.addEventListener('DOMContentLoaded', function() {
  var dataEl = document.getElementById('data-inicial');
  var mesEl  = document.getElementById('num-meses');
  if (dataEl) dataEl.addEventListener('change', atualizarPreviewRecorrente);
  if (mesEl)  mesEl.addEventListener('input',  atualizarPreviewRecorrente);
});

function enviar(){
  var valor=parseFloat(document.getElementById('valor').value);
  var desc=document.getElementById('desc').value.trim();
  var conta=document.getElementById('conta-saida').value;
  var contaE=document.getElementById('conta-entrada').value;
  var orig=document.getElementById('transf-origem').value;
  var dest=document.getElementById('transf-destino').value;

  if(!OP){fb('Selecione o tipo de operacao.','erro');return;}
  if(!valor||valor<=0){fb('Informe um valor valido.','erro');return;}
  if(!desc){fb('Informe a descricao.','erro');return;}
  if(OP==='saida'&&!conta){fb('Selecione a conta.','erro');return;}
  if(OP==='entrada'&&!contaE){fb('Selecione a conta.','erro');return;}
  if(OP==='transf'&&!orig){fb('Selecione a conta de saida.','erro');return;}
  if(OP==='transf'&&!dest){fb('Selecione a conta de entrada.','erro');return;}

  var isRec      = document.getElementById('recorrente').checked;
  var dataLanc   = document.getElementById('data-lanc').value;
  var dataInicial = isRec ? document.getElementById('data-inicial').value : dataLanc;
  var numMeses    = isRec ? (parseInt(document.getElementById('num-meses').value)||1) : 1;

  if(isRec && !dataInicial){fb('Informe a data inicial.','erro');return;}
  if(isRec && numMeses < 1){fb('Informe o numero de meses.','erro');return;}

  var btn=document.getElementById('btn-enviar');
  btn.disabled=true; btn.textContent='⏳ Registrando...';

  var dados = OP==='transf'
    ? {op:'transf',valor:valor,descricao:desc,origem:orig,destino:dest,recorrente:isRec,dataInicial:dataInicial,numMeses:numMeses}
    : {op:OP,valor:valor,descricao:desc,conta:OP==='saida'?conta:contaE,tipo:TIPO,recorrente:isRec,dataInicial:dataInicial,numMeses:numMeses};

  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='➕ Registrar Lançamento';
      if(res&&res.ok) {
        var contaLabel = OP==='transf' ? orig+' → '+dest : OP==='saida' ? conta : contaE;
        var nRec = res.registros || 1;
        adicionarHistorico(OP, desc, valor, contaLabel, TIPO);
        fb(nRec > 1 ? '✅ ' + nRec + ' lançamentos recorrentes registrados!' :
           OP==='transf'?'✅ Transferencia!':OP==='saida'?'✅ Saida registrada!':'✅ Entrada registrada!','ok');
      } else fb('❌ '+(res?res.erro:'Erro'),'erro');
    })
    .withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='➕ Registrar Lançamento';
      fb('❌ '+err.message,'erro');
    })
    .registrarLancamento(dados);
}
// Exibir histórico salvo ao carregar
window.addEventListener('DOMContentLoaded', function() { renderHistorico(); });
</script>
