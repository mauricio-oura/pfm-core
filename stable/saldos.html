  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; min-height: 100vh; padding: 16px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 24px 20px; width: 100%; max-width: 480px; margin: 8px auto; }
    .titulo { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .subtitulo { font-size: 0.78rem; color: #94a3b8; margin-bottom: 20px; }
    .label { font-size: 0.78rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin: 14px 0 6px; display: block; }
    select, input[type=number], input[type=text] {
      width: 100%; padding: 11px 12px; border: 1.5px solid #e2e8f0;
      border-radius: 10px; font-size: 0.9rem; outline: none;
      transition: border-color 0.15s; background: white;
    }
    select:focus, input:focus { border-color: #0891b2; box-shadow: 0 0 0 3px rgba(8,145,178,0.1); }
    input.erro, select.erro { border-color: #dc2626; }
    .saldo-atual {
      margin-top: 8px; padding: 10px 12px;
      background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 8px; font-size: 0.85rem; color: #0369a1;
      display: none;
    }
    .btn-enviar {
      width: 100%; margin-top: 18px; padding: 14px;
      font-size: 1rem; font-weight: 700; border-radius: 10px;
      background: #0891b2; color: white; border: none;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-enviar:hover    { background: #0e7490; }
    .btn-enviar:disabled { background: #a5f3fc; cursor: not-allowed; }
    .feedback {
      margin-top: 12px; padding: 12px 16px; border-radius: 10px;
      font-size: 0.85rem; font-weight: 500; display: none;
    }
    .feedback.ok   { background: #f0fdf4; border: 1px solid #86efac; color: #15803d; }
    .feedback.erro { background: #fef2f2; border: 1px solid #fca5a5; color: #dc2626; }
    .divider { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
    .tabela-saldos { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .tabela-saldos th { background: #1e293b; color: white; padding: 8px 10px; text-align: left; }
    .tabela-saldos td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; }
    .tabela-saldos tr:hover td { background: #f8fafc; }
    .pos { color: #15803d; font-weight: 700; }
    .neg { color: #dc2626; font-weight: 700; }
  </style>
  <style>
    .bc { display:flex; align-items:center; gap:6px; font-size:0.72rem;
          color:#94a3b8; padding:6px 16px; background:#f8fafc;
          border-bottom:1px solid #e2e8f0; }
    .bc-sep { color:#cbd5e1; }
    .bc-atual { color:#1e293b; font-weight:600; }

<body>
  <div class="bc">
    <span>🏦 Painel Financeiro</span>
    <span class="bc-sep">›</span>
    <span class="bc-atual">Saldos</span>
  </div>
<div class="card">
  <div class="titulo">💰 Atualizar Saldo</div>
  <div class="subtitulo">👤 <?= emailUsuario ?></div>

  <label class="label">Conta *</label>
  <select id="conta" onchange="mostrarSaldoAtual()">
    <option value="">Selecionar...</option>
  </select>
  <div class="saldo-atual" id="saldo-atual"></div>

  <label class="label">Novo Saldo (R$) *</label>
  <input type="number" id="novo-saldo" placeholder="0,00" step="0.01">

  <button class="btn-enviar" id="btn-enviar" onclick="enviar()">💾 Atualizar Saldo</button>
  <div class="feedback" id="feedback"></div>

  <hr class="divider">
  <div style="font-size:0.78rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px;">Saldos Atuais</div>
  <table class="tabela-saldos">
    <thead><tr><th>Conta</th><th>Descrição</th><th>Atualizado em</th><th>Saldo</th></tr></thead>
    <tbody id="tabela-body"><tr><td colspan="3" style="color:#94a3b8;">Carregando...</td></tr></tbody>
  </table>
</div>

<script>
var SALDOS = [];

// Carrega saldos ao abrir
google.script.run
  .withSuccessHandler(function(dados) {
    SALDOS = dados || [];
    var sel = document.getElementById('conta');
    SALDOS.forEach(function(s) {
      var opt = document.createElement('option');
      opt.value = s.conta;
      opt.textContent = s.descricao + ' (' + s.conta + ')';
      opt.dataset.saldo = s.saldo;
      opt.dataset.data  = s.dataAtual || '';
      sel.appendChild(opt);
    });
    renderTabela();
  })
  .withFailureHandler(function(e) { console.error(e); })
  .getSaldos();

function renderTabela() {
  var tbody = document.getElementById('tabela-body');
  if (!SALDOS.length) { tbody.innerHTML = '<tr><td colspan="3" style="color:#94a3b8;">Nenhum saldo cadastrado</td></tr>'; return; }
  tbody.innerHTML = SALDOS.map(function(s) {
    var cls = s.saldo >= 0 ? 'pos' : 'neg';
    return '<tr><td>' + s.conta + '</td><td>' + s.descricao + '</td><td style="color:#94a3b8;font-size:0.8rem;">' + (s.dataAtual || '—') + '</td><td class="' + cls + '">' + moeda(s.saldo) + '</td></tr>';
  }).join('');
}

function mostrarSaldoAtual() {
  var sel = document.getElementById('conta');
  var opt = sel.options[sel.selectedIndex];
  var div = document.getElementById('saldo-atual');
  if (!opt || !opt.value) { div.style.display = 'none'; return; }
  var saldo = parseFloat(opt.dataset.saldo) || 0;
  var data  = opt.dataset.data || '';
  div.textContent = 'Saldo atual: ' + moeda(saldo) + (data ? ' (atualizado em ' + data + ')' : '');
  div.style.display = 'block';
}

function fb(msg, tipo) {
  var el = document.getElementById('feedback');
  el.textContent = msg; el.className = 'feedback ' + tipo; el.style.display = 'block';
  if (tipo === 'ok') setTimeout(function(){ el.style.display = 'none'; }, 3000);
}

function enviar() {
  var conta    = document.getElementById('conta').value;
  var novoSaldo = parseFloat(document.getElementById('novo-saldo').value);

  document.getElementById('conta').classList.remove('erro');
  document.getElementById('novo-saldo').classList.remove('erro');

  if (!conta)              { document.getElementById('conta').classList.add('erro');      fb('Selecione a conta.', 'erro'); return; }
  if (isNaN(novoSaldo))    { document.getElementById('novo-saldo').classList.add('erro'); fb('Informe o novo saldo.', 'erro'); return; }

  var btn = document.getElementById('btn-enviar');
  btn.disabled = true; btn.textContent = '⏳ Atualizando...';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = '💾 Atualizar Saldo';
      if (res && res.ok) {
        var hoje = new Date().toLocaleDateString('pt-BR');
        fb('✅ Saldo de ' + conta + ' atualizado para ' + moeda(novoSaldo), 'ok');
        SALDOS = SALDOS.map(function(s) {
          return s.conta === conta ? Object.assign({}, s, { saldo: novoSaldo, dataAtual: hoje }) : s;
        });
        renderTabela();
        var opt = document.getElementById('conta').options[document.getElementById('conta').selectedIndex];
        if (opt) opt.dataset.saldo = novoSaldo;
        mostrarSaldoAtual();
        document.getElementById('novo-saldo').value = '';
      } else {
        fb('❌ ' + (res ? res.erro : 'Erro desconhecido'), 'erro');
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false; btn.textContent = '💾 Atualizar Saldo';
      fb('❌ Erro: ' + err.message, 'erro');
    })
    .atualizarSaldo({ conta: conta, novoSaldo: novoSaldo });
}

function moeda(v) { return (v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
</script>
</body>
